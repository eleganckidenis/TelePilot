name: Windows system verification (2.0.3)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  TELEPILOT_RUN_PRIVATE_INTEGRATION: '0'
  TELEPILOT_RUN_PLAYBACK_INTEGRATION: '1'

jobs:
  tests:
    name: System tests (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: win-x64, architecture: x64, runner: windows-latest }
          - { runtime: win-arm64, architecture: arm64, runner: windows-11-arm }
    env:
      TELEPILOT_BUILD_RUNTIME: ${{ matrix.runtime }}
      TELEPILOT_EXPECTED_WINDOWS_ARCHITECTURE: ${{ matrix.architecture }}
      VlcWindowsX64Enabled: ${{ matrix.runtime == 'win-x64' }}
      VlcWindowsArm64Enabled: ${{ matrix.runtime == 'win-arm64' }}
      VlcWindowsX86Enabled: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          architecture: ${{ matrix.architecture }}
      - name: Restore
        run: dotnet restore TelePilot.sln -p:UsedAvaloniaProducts=
      - name: Test native scheduler and seeking
        shell: pwsh
        run: |
          ./scripts/prepare-ci-ffmpeg.ps1 -Runtime $env:TELEPILOT_BUILD_RUNTIME
          $seekMedia = Join-Path $env:RUNNER_TEMP 'telepilot-system-seek.wav'
          & $env:TELEPILOT_TEST_FFMPEG -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=440:sample_rate=48000' -t 120 -c:a pcm_s16le $seekMedia
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $seekMedia -PathType Leaf)) {
            throw 'Could not generate the synthetic 120-second WAV.'
          }
          $env:TELEPILOT_TEST_TASK_SCHEDULER = '1'
          $env:TELEPILOT_TEST_NATIVE_PLAYBACK = '1'
          $env:TELEPILOT_TEST_SEEK_MEDIA = $seekMedia
          dotnet build tests/TelePilot.Tests/TelePilot.Tests.csproj --configuration Release --no-restore -p:UsedAvaloniaProducts=
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the native system tests.' }
          dotnet tests/TelePilot.Tests/bin/Release/net10.0/TelePilot.Tests.dll --filter-method 'TelePilot.Tests.App.ScheduleRecordingTests.RealTaskScheduler_RegistersAndDeletesWhenExplicitlyEnabled' 'TelePilot.Tests.Playback.PlaybackSeekingIntegrationTests.RealLibVlc_SeeksWhilePlayingAndPausedThenRejectsSeekAfterStop' --fail-skips on --minimum-expected-tests 2 --report-xunit --report-xunit-filename system-tests.xml --results-directory system-test-results --output Detailed
          if ($LASTEXITCODE -ne 0) { throw 'Native system verification failed.' }
      - name: Upload native system test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: system-tests-${{ matrix.runtime }}
          if-no-files-found: warn
          retention-days: 3
          path: system-test-results/
