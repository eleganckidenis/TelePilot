name: Windows ARM64 release artifact acceptance

on: workflow_dispatch

permissions:
  contents: read
  actions: read

jobs:
  accept-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download and verify the exact release installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'exact-arm64-artifact'
          gh run download 41994499805 --repo $env:GITHUB_REPOSITORY --name TelePilot-diagnostics-win-arm64 --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned CI artifact.' }
          $installers = @(Get-ChildItem -LiteralPath $download -Filter TelePilot-2.0.1-win-arm64-setup.exe -File -Recurse)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows ARM64 installer.' }
          $installer = $installers[0].FullName
          $sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha256 -cne 'f81fa6133986907f42f1bf2490ee822b8acbdbfe7e9857d0589385c296bdd169') {
            throw "Incorrect SHA-256 for the exact ARM64 release installer: $sha256"
          }
          Write-Host "Verified ARM64 installer SHA-256 $sha256 from run 41994499805."
          "TELEPILOT_VERIFIED_INSTALLER=$installer" >> $env:GITHUB_ENV
      - name: Verify native install, profile language on restart, upgrade and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Installer $env:TELEPILOT_VERIFIED_INSTALLER -Version 2.0.1 -Runtime win-arm64 -SkipSettingsForegroundInteraction
