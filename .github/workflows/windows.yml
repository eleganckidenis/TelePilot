name: Windows build and tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  TELEPILOT_RUN_PRIVATE_INTEGRATION: '0'

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore TelePilot.sln -p:UsedAvaloniaProducts=
      - name: Test Release
        run: dotnet test TelePilot.sln --configuration Release --no-restore -p:UsedAvaloniaProducts=

  installers:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install verified Inno Setup 6.7.3
        shell: pwsh
        run: |
          $setupPath = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setupPath
          $hash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash
          if ($hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup SHA-256 mismatch.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $setupPath
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') {
            throw 'Inno Setup publisher signature is invalid.'
          }
          $compilerDirectory = Join-Path $env:RUNNER_TEMP 'inno-setup-6'
          $setupArguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$compilerDirectory`"")
          $process = Start-Process -FilePath $setupPath -ArgumentList $setupArguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
      - name: Build installer
        shell: pwsh
        env:
          TELEPILOT_BUILD_RUNTIME: ${{ matrix.runtime }}
        run: ./scripts/build-windows-installer.ps1 -Runtime $env:TELEPILOT_BUILD_RUNTIME -InnoCompiler (Join-Path $env:RUNNER_TEMP 'inno-setup-6\ISCC.exe') -SkipTests
      - name: Archive source
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: ./scripts/prepare-github-source.ps1
      - name: Upload installers and source for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TelePilot-${{ matrix.runtime }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/release/*/${{ matrix.runtime }}/*-setup.exe
            artifacts/release/*/${{ matrix.runtime }}/*.sha256
            artifacts/release/*/source/*.zip
            artifacts/release/*/source/*.sha256
