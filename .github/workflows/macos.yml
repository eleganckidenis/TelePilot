name: Native macOS tests

on:
  push:
    branches: [main, master, 'release/**']
    paths: ['macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Confirm Apple Silicon host
        run: test "$(uname -m)" = arm64
      - name: Native Swift tests
        run: ./macos/scripts/test.sh
