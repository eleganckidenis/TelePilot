name: Native macOS tests

on:
  push:
    branches: [main, master, 'release/**']
    paths: ['macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Confirm Apple Silicon host
        run: test "$(uname -m)" = arm64
      - name: Native Swift tests
        shell: bash
        run: |
          ./macos/scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/swift-tests.log"
          if ! grep -Eq 'Test run with [1-9][0-9]* tests? passed after' "$RUNNER_TEMP/swift-tests.log"; then
            echo '::error::Swift Testing did not report a successful completed run.'
            exit 1
          fi

  package:
    name: Apple Silicon package and playback verification
    if: startsWith(github.ref, 'refs/heads/release/')
    needs: tests
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare pinned dependencies
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          deps="$RUNNER_TEMP/telepilot-dependencies"
          mkdir -p "$deps/vlc-notices"
          curl --proto '=https' --proto-redir '=https' -fLSs --retry 3 --connect-timeout 20 \
            https://download.videolan.org/pub/videolan/vlc/3.0.24/macosx/vlc-3.0.24-arm64.dmg \
            -o "$deps/vlc.dmg"
          printf '%s  %s\n' 64a89d93cdd30b0e97131743e246373db82d6826ea882d265d46d74b136da2b7 "$deps/vlc.dmg" | shasum -a 256 -c -
          ditto -x -k docs/licenses/VLC-CONTRIB-NOTICES.zip "$deps/vlc-notices"
          curl --proto '=https' --proto-redir '=https' -fLSs --retry 3 --connect-timeout 20 \
            https://github.com/eleganckidenis/TelePilot/releases/download/v2.1.1/TelePilot-2.1.1-macos-third-party-sources.zip \
            -o "$deps/ffmpeg-sources.zip"
          printf '%s  %s\n' df15b6a5057f4f81aa5b427886971e2bc36215fb7aa767f2ca398a869c099f2d "$deps/ffmpeg-sources.zip" | shasum -a 256 -c -
          mkdir -p "$deps/archives"
          unzip -q -j "$deps/ffmpeg-sources.zip" '*/sources/*' -d "$deps/archives"
          ./macos/scripts/build-ffmpeg.sh --output "$deps/ffmpeg" --archive-dir "$deps/archives" --offline
      - name: Build and verify the DMG and corresponding source archives
        shell: bash
        run: |
          deps="$RUNNER_TEMP/telepilot-dependencies"
          manifest="$deps/ffmpeg/install/share/telepilot-ffmpeg"
          version="$(tr -d '[:space:]' < macos/VERSION)"
          test "${GITHUB_REF_NAME#release/}" = "$version"
          ./macos/scripts/package-app.sh --skip-tests --vlc-dmg "$deps/vlc.dmg" \
            --vlc-license-dir "$deps/vlc-notices" --ffmpeg "$deps/ffmpeg/install/bin/ffmpeg" \
            --ffmpeg-manifest "$manifest/source-manifest.json" --ffmpeg-license-dir "$manifest/licenses"
          ./macos/scripts/create-ready-dmg.sh
          python3 ./scripts/prepare-macos-dependency-sources.py --archive-dir "$deps/ffmpeg/archives" \
            --manifest "$manifest/source-manifest.json" --license-dir "$manifest/licenses" \
            --output "macos/artifacts/TelePilot-$version-macos-third-party-sources.zip"
      - name: Retain built Apple Silicon files for verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TelePilot-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            macos/artifacts/TelePilot-*-Apple-Silicon.dmg
            macos/artifacts/TelePilot-*-Apple-Silicon.dmg.sha256
            macos/artifacts/TelePilot-*-macos-third-party-sources.zip
            macos/artifacts/TelePilot-*-macos-third-party-sources.zip.sha256
      - name: Run native AppKit, playback and system checks
        shell: bash
        run: |
          deps="$RUNNER_TEMP/telepilot-dependencies"
          printf 'Console user: %s; runner: %s\n' "$(stat -f %Su /dev/console)" "$(id -un)"
          if launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo 'Runner has an Aqua launch domain.'
          else
            echo 'Runner has no Aqua launch domain.'
          fi
          cat > "$deps/opengl-probe.c" <<'EOF'
          #include <OpenGL/OpenGL.h>
          #include <stdio.h>
          int main(void) {
              CGLPixelFormatAttribute attributes[] = {
                  kCGLPFAAllowOfflineRenderers, kCGLPFADoubleBuffer, kCGLPFAAccelerated, kCGLPFANoRecovery,
                  kCGLPFAColorSize, 24, kCGLPFAAlphaSize, 8, kCGLPFADepthSize, 24,
                  kCGLPFASupportsAutomaticGraphicsSwitching, 0
              };
              CGLPixelFormatObj format = NULL;
              CGLContextObj context = NULL;
              GLint count = 0;
              CGLError result = CGLChoosePixelFormat(attributes, &format, &count);
              printf("VLC accelerated OpenGL pixel formats: %d (error %d)\n", count, result);
              if (result == kCGLNoError && format != NULL) {
                  result = CGLCreateContext(format, NULL, &context);
                  printf("VLC accelerated OpenGL context creation: %d\n", result);
                  if (context != NULL) CGLDestroyContext(context);
                  CGLDestroyPixelFormat(format);
              }
              return 0;
          }
          EOF
          clang -Wno-deprecated-declarations -framework OpenGL "$deps/opengl-probe.c" -o "$deps/opengl-probe"
          "$deps/opengl-probe"
          version="$(tr -d '[:space:]' < macos/VERSION)"
          mount="$deps/telepilot-volume"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "macos/artifacts/TelePilot-$version-Apple-Silicon.dmg" > /dev/null
          trap 'hdiutil detach -quiet "$mount"' EXIT
          export PATH="$deps/ffmpeg/install/bin:$PATH"
          export TELEPILOT_TEST_VLC_ROOT="$mount/TelePilot.app/Contents/Frameworks/libvlc"
          export TELEPILOT_TEST_TS_FILE="$deps/synthetic.ts"
          export TELEPILOT_RUN_APPKIT_INTEGRATION=1 TELEPILOT_RUN_SYSTEM_INTEGRATION=1
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=320x180:rate=25' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' -t 15 \
            -c:v mpeg2video -g 12 -b:v 480k -c:a mp2 -b:a 128k -f mpegts "$TELEPILOT_TEST_TS_FILE"
          test_log="$RUNNER_TEMP/native-swift-tests.log"
          python3 ./macos/scripts/test-network-buffer.py --no-parallel 2>&1 | tee "$test_log"
          if ! grep -Eq 'Test run with [1-9][0-9]* tests? passed after' "$test_log" ||
             ! grep -Fq 'Test managerOpensForFirstRunAndImportsSwitchesRemovesAndReturnsFocus() passed after' "$test_log"; then
            echo '::error::Swift Testing did not complete the native playback and system test run successfully.'
            exit 1
          fi
